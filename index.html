<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>퍼셀 가이드라인</title>
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="퍼셀 가이드라인">
  <meta property="og:description" content="PURCELL × Creator Campaign">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #1F3A4D;
      --brand-deep: #152A39;
      --brand-line: #3D6178;
      --brand-pale: #E4EEF2;
      --brand-text: #2A6178;
      --cream: #F6F9FA;
      --warm-white: #EDF3F5;
      --text-dark: #18242E;
      --text-mid: #546673;
      --text-light: #95A5B0;
      --border: #D5E0E5;
      --tag-bg: #E5EEF1;
      --mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      overflow-x: hidden;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding-bottom: 64px; }

    /* PASSWORD GATE */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #0F1E2B 0%, var(--brand-deep) 58%, var(--brand) 120%);
    }
    .gate-box {
      width: 100%;
      max-width: 340px;
      text-align: center;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.20);
      border-radius: 22px;
      padding: clamp(32px, 8vw, 40px) clamp(22px, 6vw, 28px);
      backdrop-filter: blur(6px);
    }
    .gate-badge {
      display: inline-block;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.32);
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #FFFFFF;
      padding: 6px 16px;
      margin-bottom: 18px;
    }
    .gate-box h1 {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .gate-box p {
      color: rgba(255,255,255,0.72);
      font-size: 12.5px;
      margin-bottom: 22px;
    }
    .gate-box input {
      width: 100%;
      text-align: center;
      font-family: var(--mono);
      font-size: 20px;
      letter-spacing: 0.4em;
      color: #FFFFFF;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.30);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .gate-box input:focus { outline: 2px solid rgba(255,255,255,0.55); outline-offset: 1px; }
    .gate-box input::placeholder { color: rgba(255,255,255,0.32); letter-spacing: 0.3em; font-size: 14px; }
    .gate-box button {
      width: 100%;
      min-height: 48px;
      background: #FFFFFF;
      color: var(--brand-deep);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .gate-err { color: #FFD3C4; font-size: 12px; margin-top: 12px; min-height: 16px; }

    /* HUB */
    #hub { display: none; }

    .hub-hero {
      position: relative;
      background: #E9EBEE;
    }
    .hub-hero img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: center 35%; display: block; }
    .hub-hero-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      text-align: center;
      padding: 0 24px 34px;
      background: linear-gradient(to bottom,
        rgba(19,38,58,0) 42%,
        rgba(19,38,58,0.30) 64%,
        rgba(19,38,58,0.70) 86%,
        rgba(19,38,58,0.88) 100%);
    }
    .hero-eyebrow {
      font-size: 10px;
      letter-spacing: 0.35em;
      font-weight: 400;
      color: rgba(255,255,255,0.78);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .hero-sub {
      font-size: 10px;
      font-weight: 300;
      color: rgba(255,255,255,0.72);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hub-body { padding: 36px 28px 0; }
    .hub-label {
      display: inline-flex;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brand-text);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      margin-bottom: 12px;
    }
    .hub-title { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 4px; }
    .hub-desc { font-size: 12.5px; color: var(--text-mid); line-height: 1.7; margin-bottom: 20px; }
    .hub-desc strong { color: var(--brand-text); font-weight: 700; }

    .hub-list { display: flex; flex-direction: column; gap: 10px; }
    .hub-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 64px;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      text-decoration: none;
      color: var(--text-dark);
    }
    .hub-card:active { background: var(--warm-white); border-color: var(--brand-line); }
    .hub-card-left { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .hub-card-badge {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--brand);
      border: 1px solid var(--brand-line);
      color: #FFFFFF;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hub-card-title { display: block; font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
    .hub-card-sub { display: block; font-size: 11.5px; color: var(--text-mid); margin-top: 1px; }
    .hub-card-fee {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-text);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 9px;
      margin-left: 6px;
      white-space: nowrap;
    }
    .hub-card-arrow { flex: none; font-size: 14px; color: var(--brand-text); }
    .hub-card.is-brand { margin-top: 10px; border-style: dashed; border-color: var(--brand-line); background: var(--warm-white); }
    .hub-card.is-brand .hub-card-badge { background: #FFFFFF; color: var(--brand); font-size: 11px; }

    /* FOLDER */
    .hub-folders { display: flex; flex-direction: column; gap: 12px; }
    .hub-folder {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .hub-folder-summary {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 14px 16px;
      cursor: pointer;
      list-style: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .hub-folder-summary::-webkit-details-marker { display: none; }
    .hub-folder-icon {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--brand-pale);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hub-folder-icon svg { width: 18px; height: 18px; }
    .hub-folder-text { flex: 1; min-width: 0; }
    .hub-folder-name { display: block; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .hub-folder-sub { display: block; font-size: 11.5px; color: var(--text-mid); margin-top: 1px; }
    .hub-folder-count {
      flex: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-text);
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 9px;
    }
    .hub-folder-chevron { flex: none; font-size: 12px; color: var(--brand-text); transition: transform .2s ease; }
    .hub-folder[open] .hub-folder-chevron { transform: rotate(180deg); }
    .hub-folder-body { padding: 0 12px 12px; }

    .hub-note {
      font-size: 11px;
      color: var(--text-light);
      line-height: 1.7;
      margin-top: 16px;
    }

    .hub-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-light);
      line-height: 1.9;
      margin-top: 32px;
      padding: 24px 28px;
      padding-bottom: max(24px, env(safe-area-inset-bottom, 24px));
      border-top: 1px solid var(--border);
    }
    .hub-footer strong { color: var(--text-mid); font-weight: 700; }

    @media (max-width: 480px) {
      .hero-title { font-size: 18px; }
      .hub-hero-overlay { padding: 0 18px 24px; }
      .hub-body { padding: 28px 20px 0; }
      .hub-footer { padding-left: 20px; padding-right: 20px; }
    }
    @media (max-width: 360px) {
      .hub-body { padding: 24px 14px 0; }
      .hub-card { padding: 12px 13px; }
      .hub-card-badge { width: 32px; height: 32px; font-size: 12px; }
      .hub-card-title { font-size: 13.5px; }
      .hub-footer { padding-left: 14px; padding-right: 14px; }
    }
  </style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-badge">PURCELL Guide Hub</div>
    <h1>비밀번호 확인</h1>
    <p>담당자에게 전달받은 비밀번호를 입력해 주세요.</p>
    <input type="password" id="pw" inputmode="numeric" maxlength="4" placeholder="&bull;&bull;&bull;&bull;" autocomplete="off" aria-label="비밀번호">
    <button type="button" id="pwBtn">입장하기</button>
    <div class="gate-err" id="pwErr" role="alert"></div>
  </div>
</div>

<!-- HUB -->
<div id="hub">
  <div class="wrap">
    <div class="hub-hero">
      <img src="image/product.jpg" alt="퍼셀 픽셀바이옴 세라캡슐 인텐시브 크림">
      <div class="hub-hero-overlay">
        <div class="hero-eyebrow">Guide Hub</div>
        <div class="hero-title">퍼셀 가이드 허브</div>
        <div class="hero-sub">PURCELL × Creator Campaign</div>
      </div>
    </div>

    <div class="hub-body">
      <div class="hub-label">Guidelines</div>
      <div class="hub-title">혹한기 구원크림 출시</div>
      <div class="hub-desc">픽셀바이옴 세라캡슐 인텐시브 크림&nbsp;&mdash; 안내받으신 <strong>타입</strong>의 가이드라인을 열어주세요.</div>

      <div class="hub-folders" id="hubList"></div>

      <div class="hub-note">&bull; 타입은 브랜드에서 채널 성격에 맞춰 배정해 드립니다. 본인 타입이 확실하지 않은 경우 담당자에게 확인해 주세요.</div>
    </div>

    <div class="hub-footer">
      <strong>PURCELL (퍼셀)</strong><br>
      본 가이드라인은 선별된 크리에이터에게만 제공되는 자료입니다.
    </div>
  </div>
</div>

<script>
  /* 가이드 폴더 — 월별 폴더 추가·수정은 여기만 바꾸면 됩니다 (open: true 면 펼친 상태로 시작) */
  var FOLDERS = [
    {
      name: '10월 진행',
      sub: '혹한기 구원크림 출시',
      open: true,
      guides: [
        { badge: 'A', type: 'A Type', fee: '5만원',     href: 'a-type.html' },
        { badge: 'B', type: 'B Type', fee: '10만원',    href: 'b-type.html' },
        { badge: 'C', type: 'C Type', fee: '15만원',    href: 'c-type.html' },
        { badge: 'D', type: 'D Type', fee: '20만원',    href: 'd-type.html' },
        { badge: 'E', type: 'E Type', fee: '25만원',    href: 'e-type.html' },
        { badge: 'F', type: 'F Type', fee: '30만원',    href: 'f-type.html' },
        { badge: 'G', type: 'G Type', fee: '40만원',    href: 'g-type.html' },
        { badge: 'H', type: 'H Type', fee: '50만원',    href: 'h-type.html' },
        { badge: 'I', type: 'I Type', fee: '고료 조정', href: 'i-type.html' },
        { badge: 'BR', type: '브랜드 공유용', fee: '신청·정산 제외', href: 'brand.html', sub: '브랜드 전달용 가이드라인', brand: true }
      ]
    }
  ];

  var PASSWORD = '0907';
  var STORAGE_KEY = 'purcell_hub_ok';

  var gate = document.getElementById('gate');
  var hub = document.getElementById('hub');
  var pwInput = document.getElementById('pw');
  var pwBtn = document.getElementById('pwBtn');
  var pwErr = document.getElementById('pwErr');
  var hubList = document.getElementById('hubList');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var FOLDER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';

  function renderCards(guides) {
    return guides.map(function (g) {
      return '<a class="hub-card' + (g.brand ? ' is-brand' : '') + '" href="' + esc(g.href) + '">' +
               '<span class="hub-card-left">' +
                 '<span class="hub-card-badge">' + esc(g.badge) + '</span>' +
                 '<span>' +
                   '<span class="hub-card-title">' + esc(g.type) +
                     '<span class="hub-card-fee">' + esc(g.fee) + '</span>' +
                   '</span>' +
                   '<span class="hub-card-sub">' + esc(g.sub || '크리에이터 가이드라인') + '</span>' +
                 '</span>' +
               '</span>' +
               '<span class="hub-card-arrow">&rarr;</span>' +
             '</a>';
    }).join('');
  }

  function renderList() {
    hubList.innerHTML = FOLDERS.map(function (f) {
      return '<details class="hub-folder"' + (f.open ? ' open' : '') + '>' +
               '<summary class="hub-folder-summary">' +
                 '<span class="hub-folder-icon">' + FOLDER_SVG + '</span>' +
                 '<span class="hub-folder-text">' +
                   '<span class="hub-folder-name">' + esc(f.name) + '</span>' +
                   (f.sub ? '<span class="hub-folder-sub">' + esc(f.sub) + '</span>' : '') +
                 '</span>' +
                 '<span class="hub-folder-count">' + f.guides.length + '</span>' +
                 '<span class="hub-folder-chevron">&#9660;</span>' +
               '</summary>' +
               '<div class="hub-folder-body"><div class="hub-list">' + renderCards(f.guides) + '</div></div>' +
             '</details>';
    }).join('');
  }

  function unlock() {
    pwErr.textContent = '';
    gate.style.display = 'none';
    hub.style.display = 'block';
    try { sessionStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
  }

  function tryUnlock() {
    if (pwInput.value.trim() === PASSWORD) {
      unlock();
    } else {
      pwErr.textContent = '비밀번호가 올바르지 않습니다.';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  renderList();

  var alreadyIn = false;
  try { alreadyIn = sessionStorage.getItem(STORAGE_KEY) === '1'; } catch (e) {}
  if (alreadyIn) unlock();

  pwBtn.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
  pwInput.addEventListener('input', function () { pwErr.textContent = ''; });
  pwInput.focus();
</script>

</body>
</html>
